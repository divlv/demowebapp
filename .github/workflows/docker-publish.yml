name: Build and publish Docker image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/divlv/demowebapp

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      - name: Print image usage instructions
        run: |
          echo "Docker image published:"
          echo "${IMAGE_NAME}:latest"
          echo ""
          echo "Run it locally with:"
          echo "docker pull ${IMAGE_NAME}:latest"
          echo "docker run --rm -p 8080:8000 -e APP_TITLE=\"Demo Web App\" -e APP_THEME=1 ${IMAGE_NAME}:latest"
          echo ""
          echo "Open in a browser:"
          echo "http://localhost:8080"
          echo ""
          echo "Test plain-text output:"
          echo "curl http://localhost:8080"
