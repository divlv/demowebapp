name: Build and publish Docker image to ACR

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "Docker image repository name inside ACR"
        required: true
        default: "demowebapp"
        type: string
      image_tag:
        description: "Docker image tag to publish"
        required: true
        default: "latest"
        type: string

permissions:
  contents: read

jobs:
  build-and-publish-acr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/${{ inputs.image_name }}:${{ inputs.image_tag }}

      - name: Print image usage instructions
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          IMAGE="${ACR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "Docker image published to Azure Container Registry:"
          echo "${IMAGE}"
          echo ""
          echo "Run it locally with:"
          echo "docker login ${ACR_REGISTRY}"
          echo "docker pull ${IMAGE}"
          echo "docker run --rm -p 8080:8000 -e APP_TITLE=\"Demo Web App\" -e APP_THEME=1 ${IMAGE}"
          echo ""
          echo "Open in a browser:"
          echo "http://localhost:8080"
          echo ""
          echo "Test plain-text output:"
          echo "curl http://localhost:8080"
